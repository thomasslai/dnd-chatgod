[project]
name = "dnd-chatgod"
version = "0.1.0"
description = "Aglar DnD Chatgod"
readme = "README.md"
authors = [
    { name = "Thomas", email = "lai.thomas@outlook.de" }
]
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.48.1",
    "python-dotenv>=1.0.1",
    "llama-index>=0.13.3",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "openai>=1.101.0",
    "cryptography>=43.0.0",
    "PyPDF2>=3.0.0",
    "odfpy>=1.4.1",
    "python-docx>=1.2.0",
]

[project.scripts]
dnd-chatgod = "dnd_chatgod:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
